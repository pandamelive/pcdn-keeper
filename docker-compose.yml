services:
  pcdn-keeper:
    image: ghcr.io/pandamelive/pcdn-keeper:latest
    container_name: pcdnkeeper
    restart: always
    ports:
      - "5566:5566"
    volumes:
      # pk 工作目录持久化（config.yaml、pk-data/state.json、artifacts/）
      - ./data:/pnos/controlcentre/pk-controlcenter
    tmpfs:
      # 下载目录用容器标准 /tmp，内存文件系统，完全不落盘
      - /tmp
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

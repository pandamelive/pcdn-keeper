name: Sync compose to README
on:
  push:
    paths:
      - 'docker-compose.yml'
  workflow_dispatch:

jobs:
  update_readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace compose block in README
        run: |
          CONTENT=$(cat docker-compose.yml)
          awk -v content="$CONTENT" '
          /<!-- COMPOSE_START -->/ {print; flag=1; next}
          /<!-- COMPOSE_END -->/ {flag=0; print "```yaml"; print content; print "```"; print; next}
          flag==0 {print}
          ' README.md > tmp.md && mv tmp.md README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "docs: auto sync docker-compose.yml to readme"
          git push

name: Auto Approve

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write
  checks: read
  contents: write

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    if: github.actor == 'pandamelive'
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: 4769518
          private-key: ${{ secrets.AUTO_APPROVE_PRIVATE_KEY }}

      - name: Approve and merge
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "Approving PR #$PR_NUMBER..."
          HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
            -H "Authorization: token $APP_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/reviews" \
            -d '{"event":"APPROVE","body":"Auto-approved"}')
          cat /tmp/resp.json
          echo ""
          if [ "$HTTP" != "200" ] && [ "$HTTP" != "201" ]; then
            echo "::error::Approve failed HTTP $HTTP"
            exit 1
          fi

          sleep 5
          echo "Merging PR #$PR_NUMBER..."
          MERGE_HTTP=$(curl -s -o /tmp/merge.json -w "%{http_code}" -X PUT \
            -H "Authorization: token $APP_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/pulls/$PR_NUMBER/merge" \
            -d '{"merge_method":"merge"}')
          cat /tmp/merge.json
          echo ""
          if [ "$MERGE_HTTP" = "200" ]; then
            echo "PR #$PR_NUMBER merged successfully"
          else
            echo "::error::Merge failed HTTP $MERGE_HTTP"
            exit 1
          fi

name: Tag Guard

on:
  create:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  tag-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PandaNetOS Tag Guard
        uses: PandaNetOS/PandaNetOS/actions/tag-guard@main
        with:
          delete-on-failure: true
          check-ci-status: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

name: Build & Push pcdn-keeper Docker Image
on:
  workflow_dispatch:
  release:
    types: [published]
  repository_dispatch:
    types: [upstream-release]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/pcdn-keeper:latest
            ghcr.io/${{ github.repository_owner }}/pcdn-keeper:${{ github.ref_name }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/pcdn-keeper:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/pcdn-keeper:${{ github.ref_name }}

name: Build & Push pcdn-keeper Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
  repository_dispatch:
    types: [upstream-release]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Get upstream versions
        id: versions
        run: |
          # 获取所有非 draft、非 pre-release 的 release，按语义化版本排序取最新
          # 不用 releases/latest（按发布时间排序），改用所有 release 按版本号排序，确保是真正的最新版
          get_latest_version() {
            local repo=$1
            local ver=$(curl -sf "https://api.github.com/repos/${repo}/releases?per_page=100" | \
              jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name' | \
              sed 's/^v//' | sort -V | tail -1)
            if [ -z "${ver}" ] || [ "${ver}" = "null" ]; then
              echo "ERROR: 无法获取 ${repo} 的最新版本"
              exit 1
            fi
            echo "${ver}"
          }
          PK_VER=$(get_latest_version "pandamelive/pk")
          SPDE_VER=$(get_latest_version "pandamelive/spde")
          echo "pk_version=${PK_VER}" >> $GITHUB_OUTPUT
          echo "spde_version=${SPDE_VER}" >> $GITHUB_OUTPUT
          echo "combo_tag=pk-v${PK_VER}_spde-v${SPDE_VER}" >> $GITHUB_OUTPUT
          echo "PK version: ${PK_VER}"
          echo "SPDE version: ${SPDE_VER}"
          echo "Combo tag: pk-v${PK_VER}_spde-v${SPDE_VER}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            PK_VERSION=${{ steps.versions.outputs.pk_version }}
            SPDE_VERSION=${{ steps.versions.outputs.spde_version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/pcdn-keeper:latest
            ghcr.io/${{ github.repository_owner }}/pcdn-keeper:${{ steps.versions.outputs.combo_tag }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/pcdn-keeper:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/pcdn-keeper:${{ steps.versions.outputs.combo_tag }}

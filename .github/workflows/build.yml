name: Build & Push pcdn-keeper Docker Image
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    # job失败自动重试最多3次，间隔15秒
    strategy:
      fail-fast: false
      max-parallel: 1
    continue-on-error: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pcdn-keeper:latest
            ghcr.io/${{ github.repository_owner }}/pcdn-keeper:${{ github.ref_name }}

name: Build & Push pcdn-keeper Docker Image
on:
  # 手动触发：Actions页面点按钮运行
  workflow_dispatch:
  # 仅发布Release时触发，push代码不再触发
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: nick-invision/retry@v3
        with:
          max_attempts: 3
          retry_wait_seconds: 15
        steps:
          - name: Build
            uses: docker/build-push-action@v6
            with:
              context: .
              push: true
              no-cache: true
              tags: |
                ghcr.io/${{ github.repository_owner }}/pcdn-keeper:latest
                ghcr.io/${{ github.repository_owner }}/pcdn-keeper:${{ github.ref_name }}

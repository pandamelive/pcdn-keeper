name: Build & Push pcdn-keeper Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
  repository_dispatch:
    types: [upstream-release]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Get upstream versions
        id: versions
        run: |
          # 用 /releases?per_page=1 取最新创建的 release（按创建时间倒序）
          # 不使用 /releases/latest 端点，因为该端点对 spde 返回了错误的旧版本(v0.2.0)
          get_latest_version() {
            local repo=$1
            local ver
            ver=$(curl -sf "https://api.github.com/repos/${repo}/releases?per_page=1" | \
              jq -r '.[0].tag_name' | sed 's/^v//')
            if [ -z "${ver}" ] || [ "${ver}" = "null" ]; then
              echo "ERROR: 无法获取 ${repo} 的最新版本"
              exit 1
            fi
            echo "${ver}"
          }

          # 默认从 API 获取最新版本
          PK_VER=$(get_latest_version "pandamelive/pk")
          SPDE_VER=$(get_latest_version "pandamelive/spde")

          # 如果是 repository_dispatch 触发，且 client_payload 包含版本号，优先使用（避免竞态：一个上游发了另一个还没发）
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            UPSTREAM="${{ github.event.client_payload.upstream }}"
            DISPATCH_VERSION="${{ github.event.client_payload.version }}"
            # 去除版本号前导 v
            DISPATCH_VERSION=$(echo "${DISPATCH_VERSION}" | sed 's/^v//')
            if [ -n "${DISPATCH_VERSION}" ] && [ "${DISPATCH_VERSION}" != "null" ]; then
              if [ "${UPSTREAM}" = "pk" ]; then
                PK_VER="${DISPATCH_VERSION}"
                echo "使用 repository_dispatch 传入的 pk 版本: ${PK_VER}"
              elif [ "${UPSTREAM}" = "spde" ]; then
                SPDE_VER="${DISPATCH_VERSION}"
                echo "使用 repository_dispatch 传入的 spde 版本: ${SPDE_VER}"
              fi
            fi
          fi

          # 版本号校验：不能是 unknown 或空
          if [ -z "${PK_VER}" ] || [ "${PK_VER}" = "unknown" ]; then
            echo "ERROR: pk 版本号无效: ${PK_VER}"
            exit 1
          fi
          if [ -z "${SPDE_VER}" ] || [ "${SPDE_VER}" = "unknown" ]; then
            echo "ERROR: spde 版本号无效: ${SPDE_VER}"
            exit 1
          fi

          echo "pk_version=${PK_VER}" >> $GITHUB_OUTPUT
          echo "spde_version=${SPDE_VER}" >> $GITHUB_OUTPUT
          echo "combo_tag=pk-v${PK_VER}_spde-v${SPDE_VER}" >> $GITHUB_OUTPUT
          echo "PK version: ${PK_VER}"
          echo "SPDE version: ${SPDE_VER}"
          echo "Combo tag: pk-v${PK_VER}_spde-v${SPDE_VER}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_ACR_REGISTRY }}
          username: ${{ secrets.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          provenance: false
          platforms: linux/amd64,linux/arm64
          build-args: |
            PK_VERSION=${{ steps.versions.outputs.pk_version }}
            SPDE_VERSION=${{ steps.versions.outputs.spde_version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/pcdn-keeper:latest
            ghcr.io/${{ github.repository_owner }}/pcdn-keeper:${{ steps.versions.outputs.combo_tag }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/pcdn-keeper:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/pcdn-keeper:${{ steps.versions.outputs.combo_tag }}
            ${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ secrets.ALIYUN_ACR_NAMESPACE }}/pcdn-keeper:latest
            ${{ secrets.ALIYUN_ACR_REGISTRY }}/${{ secrets.ALIYUN_ACR_NAMESPACE }}/pcdn-keeper:${{ steps.versions.outputs.combo_tag }}

name: Build & Push pcdn-keeper Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
  repository_dispatch:
    types: [upstream-release]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Get upstream versions
        id: versions
        run: |
          PK_VER=$(curl -sf "https://api.github.com/repos/pandamelive/pk/releases/latest" | jq -r '.tag_name' | sed 's/^v//')
          SPDE_VER=$(curl -sf "https://api.github.com/repos/pandamelive/spde/releases/latest" | jq -r '.tag_name' | sed 's/^v//')
          echo "pk_version=${PK_VER}" >> $GITHUB_OUTPUT
          echo "spde_version=${SPDE_VER}" >> $GITHUB_OUTPUT
          echo "combo_tag=pk-v${PK_VER}_spde-v${SPDE_VER}" >> $GITHUB_OUTPUT
          echo "PK version: ${PK_VER}"
          echo "SPDE version: ${SPDE_VER}"
          echo "Combo tag: pk-v${PK_VER}_spde-v${SPDE_VER}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          no-cache: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            PK_VERSION=${{ steps.versions.outputs.pk_version }}
            SPDE_VERSION=${{ steps.versions.outputs.spde_version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/pcdn-keeper:latest
            ghcr.io/${{ github.repository_owner }}/pcdn-keeper:${{ steps.versions.outputs.combo_tag }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/pcdn-keeper:latest
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/pcdn-keeper:${{ steps.versions.outputs.combo_tag }}

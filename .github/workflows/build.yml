name: Build & Push pcdn-keeper Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [upstream-release]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: PandaNetOS/PandaNetOS/.github/workflows/reusable-release-docker-image.yml@main
    with:
      image_name: pcdn-keeper
      platforms: linux/amd64,linux/arm64
      push_to_ghcr: true
      push_to_dockerhub: false
      push_to_aliyun: true
      tag_latest: true
      tag_sha: true
      fetch_upstream_versions: true
      upstream_repos: '["pandamelive/pk","pandamelive/spde"]'
      combo_tag_format: 'pk-v{pk}_spde-v{spde}'
      provenance: false
    secrets: inherit

# SPDE 配置文件 - pcdn-keeper 默认配置
# 挂载路径: /app/spde/config/config.yaml
# 修改此文件后无需重建镜像，重启容器即可生效

global:
  work_dir: null
  # 最大并发下载任务数
  max_concurrent: 4
  # 断点续传（PCDN 流量模拟建议关闭，每次重新下载以持续产生流量）
  resume: false
  # 单任务失败重试次数
  retry_times: 3
  # 单任务超时秒数
  timeout: 1800
  # 跳过 TLS 证书验证
  skip_tls_verify: false
  # 单文件并发连接数（类似 aria2 的 split / max-connection-per-server）
  connections_per_file: 16
  # 试运行模式（不实际下载）
  dry_run: false

output:
  # 下载保存目录，容器内对应 tmpfs（内存文件系统），不落盘
  save_path: "/tmp/downloads"

proxy:
  http_proxy: ""
  https_proxy: ""

# 直接下载任务列表
# 每个任务: name(名称) enable(是否启用) url(下载地址) filename(保存文件名)
direct_tasks:
  - name: "iPhone 4.7 12.1.4 固件"
    enable: true
    url: "http://updates-http.cdn-apple.com/2019WinterFCS/fullrestores/041-39257/32129B6C-292C-11E9-9E72-4511412B0A59/iPhone_4.7_12.1.4_16D57_Restore.ipsw"
    filename: "iPhone_4.7_12.1.4_16D57_Restore.ipsw"

  - name: "iPhone 4S iOS 9.3.5 固件"
    enable: true
    url: "http://appldnld.apple.com/iOS9.3.5/031-73068-20160825-6A2B99DE-6711-11E6-BB8F-133834D2D062/iPhone4,1_9.3.5_13G36_Restore.ipsw"
    filename: "iPhone4,1_9.3.5_13G36_Restore.ipsw"

  - name: "iPhone iOS 15.3 固件"
    enable: true
    url: "https://updates.cdn-apple.com/2022FCSWinter/fullrestores/002-57695/F64E2C74-C18B-48B3-8BC2-FF0DB4E21301/iPhone11,2,iPhone11,4,iPhone11,6,iPhone12,3,iPhone12,5_15.3_19D50_Restore.ipsw"
    filename: "iPhone11,2,iPhone11,4,iPhone11,6,iPhone12,3,iPhone12,5_15.3_19D50_Restore.ipsw"
